services:
  - type: web
    name: upcard-app
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run docker-start
    healthCheckPath: /
    disk:
      name: upcard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/prod.sqlite
      - key: SCOPES
        value: read_discounts,read_locales,read_orders,read_products,read_themes,write_discounts,write_files,write_products,write_translations
      - key: SHOPIFY_APP_URL
        value: https://upcard-app.onrender.com
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
