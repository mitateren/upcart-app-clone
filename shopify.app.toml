# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bf5472c84b033938e4f3cf3e9abd7eaa"
name = "UpCard"
# TODO: kendi HTTPS domaininle degistir (ornek: https://upcard.tisortgetir.com)
application_url = "https://upcart.gezionlugu.com"
embedded = true

[access_scopes]
scopes = "read_discounts,read_locales,read_orders,read_products,read_themes,write_discounts,write_files,write_products,write_translations"

[auth]
redirect_urls = [
  "https://upcart.gezionlugu.com/auth/callback",
  "https://upcart.gezionlugu.com/auth/shopify/callback",
  "https://upcart.gezionlugu.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[app_proxy]
url = "https://upcart.gezionlugu.com/api/proxy"
subpath = "upcard"
prefix = "apps"

[shop.metafields.app.live_cart_config]
type = "json"
name = "UpCard Live Cart Config"
description = "Published UpCard cart drawer configuration"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
