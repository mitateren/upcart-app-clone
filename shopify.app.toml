# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration
name = "UpCard"
client_id = ""
application_url = "https://localhost"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_products,write_products,read_discounts,write_discounts,read_orders,write_files,read_themes,write_translations,read_locales"

[auth]
redirect_urls = ["https://localhost/api/auth"]

[app_proxy]
url = "https://localhost/api/proxy"
subpath = "upcard"
prefix = "apps"

# Live cart config for storefront
[shop.metafields.app.live_cart_config]
type = "json"
name = "UpCard Live Cart Config"
description = "Published UpCard cart drawer configuration"
access.admin = "merchant_read_write"
access.storefront = "public_read"
